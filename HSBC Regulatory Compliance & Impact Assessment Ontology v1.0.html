<style>

:root[data-theme="dark"]{--bg:#0f1217;--card:#181c23;--fg:#e8ebf0;--mut:#9aa3b2;--ln:#2a303a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:16px 18px 8px}h1{font-size:19px;margin:0}header p{margin:4px 0 0;color:var(--mut);font-size:13px}

.tabs button{border:0;background:none;color:var(--mut);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--acc)}
section{display:none;padding:14px}section.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.off{opacity:.35}.dot{width:9px;height:9px;border-radius:50%}
#wrap{overflow:auto;border:1px solid var(--ln);border-radius:10px;background:var(--card);height:68vh;touch-action:pan-x pan-y}
svg text{font-size:11.5px;fill:var(--fg);pointer-events:none}
.node rect{stroke-width:1.5;cursor:pointer;fill:var(--card)}.node.dim{opacity:.15}.edge{fill:none;stroke-width:1.2;opacity:.45}.edge.dim{opacity:.04}.edge.hi{opacity:1;stroke-width:2}
.lane{font-size:12px;font-weight:700}
#info{margin-top:12px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:13px}
#info h3{margin:0 0 4px}.mut{color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--card)}th,td{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--card)}
input{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
pre{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px;white-space:pre}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.k{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;color:#fff}
.zoom{display:flex;gap:6px;margin-bottom:8px;align-items:center}.zoom button{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 10px;font:inherit;cursor:pointer}
ul{padding-left:18px}

// DESIGN
document.getElementById('t-design').innerHTML=`
<div class="card"><b>Purpose.</b> One graph that serves two jobs: (A) a <b>baseline compliance graph</b> — what regulation requires, which obligations, risks, controls and policies cover it, and where; (B) <b>alert-specific impact</b> — for each Rapid2 alert, what is impacted, how sure we are, who owns it, and what the gap is. Risk Stewards consume B; B is always explainable back to A.</div>
<div class="card"><b>Design principles</b><ul>
<li><b>Structural lineage ≠ alert impact.</b> Baseline edges (RGL→RSM→ROB→Risk→L1C→1C) are curated facts. Alert edges are <i>inferences</i> and live as reified <b>LinkAssertion</b> nodes with decision, relevance (0–10), confidence (1–5), evidence spans, method, model/prompt version and SME status. A shortcut edge (e.g. IMPACTS_CONTROL) is materialised only from LINKED assertions.</li>
<li><b>Granularity is declared, never implied.</b> Every assertion states RGL / RSM / ROB / L1C / 1C. RGL-level links cannot explode to control impact without an explicit flag — this is the ontology-level fix for the ~30× over-mapping seen in the current golden.</li>
<li><b>Obligation is the hub.</b> Controls (ADDRESSES), policy requirements (ADDRESSES) and gaps all anchor on ROB. Gap = affected ROB with no / partial coverage.</li>
<li><b>Applicability is first-class.</b> ApplicabilityScope scopes obligations to entity, LOB, product, process, customer segment and jurisdiction — this is what computes blast radius rather than "all controls under the regulation".</li>
<li><b>Bitemporal & versioned.</b> Every node/edge carries validFrom/validTo, sourceSystem and ontologyVersion so an IA can be replayed "as at" sign-off date (MRM / audit requirement).</li>
<li><b>Human-in-the-loop by construction.</b> Only CONFIRMED assertions feed IA sign-off; UNREVIEWED model discoveries form the SME queue and are never counted as errors.</li>
<li><b>Reuse standards.</b> SKOS for taxonomies (risk, theme, jurisdiction), SHACL for quality gates, PROV-O pattern for provenance; aligns with FIBO/LKIF concepts for Regulator, LegalEntity, Obligation if Group adopts them.</li></ul></div>
<div class="card"><b>Modules</b><ul>${Object.entries(D.M).map(([k,v])=>`<li><span class="dot" style="display:inline-block;background:${v.c}"></span> <b>${v.n}</b> — ${D.C.filter(c=>c.m==k).map(c=>c.l).join(', ')}</li>`).join('')}</ul></div>
<div class="card"><b>Source systems → ontology</b><ul><li><b>Rapid2</b> → RegulatoryAlert, Regulator, Jurisdiction, RiskTaxonomy tags</li><li><b>RegMap</b> → Regulation, RegulatorySummary, Obligation, Control ADDRESSES Obligation</li><li><b>Helios</b> → Control, LibraryControl, ControlObjective</li><li><b>US_Risk / RTCL</b> → Risk, RiskTaxonomy, MITIGATED_BY</li><li><b>GPPS</b> → Policy, PolicyRequirement, Standard</li><li><b>Pipeline verdicts / manifest</b> → LinkAssertion, Evidence, ModelRun</li><li><b>Review queue</b> → SMEValidation</li><li><b>Entity / Org / Product / CMDB masters</b> → Business Context</li></ul></div>
<div class="card"><b>Rollout</b><ul><li><b>Phase 1 (now):</b> REG + CTL + RSK + PRV loaded from RegMap/Helios/US_Risk + current alert→control verdicts as LinkAssertions.</li><li><b>Phase 2:</b> GOV (ROB→GPPS linkage workstream) + IMP (findings, gaps, blast radius) + steward UI.</li><li><b>Phase 3:</b> SEM extraction (modality, conditions, deadlines) + full ApplicabilityScope for entity-level blast radius.</li></ul></div>`;

function rtab(q=''){q=q.toLowerCase();document.getElementById('rtab').innerHTML='<tr><th>Domain</th><th>Relationship</th><th>Range</th><th>Card.</th><th>Kind</th><th>Note</th></tr>'+D.R.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<tr><td>${r.f}</td><td><b>${r.r}</b></td><td>${r.t}</td><td>${r.card}</td><td><span class="k" style="background:${KIND[r.k][1]}">${KIND[r.k][0]}</span></td><td class=mut>${esc(r.n)}</td></tr>`).join('')}
ctab();rtab();cq.oninput=e=>ctab(e.target.value);rq.oninput=e=>rtab(e.target.value);
document.getElementById('stab').innerHTML='<tr><th>#</th><th>Target</th><th>Rule</th><th>Severity</th></tr>'+D.S.map((s,i)=>`<tr><td>${i+1}</td><td><b>${s.t}</b></td><td>${esc(s.r)}</td><td>${s.s}</td></tr>`).join('');
document.getElementById('t-queries').innerHTML='<p class=mut>Cypher patterns the Risk Steward UI / agent runs against the graph (Neo4j syntax; SPARQL equivalents generate from the TTL).</p>'+D.Q.map((q,i)=>`<div class=card><b>${i+1}. ${esc(q.q)}</b><pre>${esc(q.c)}</pre></div>`).join('');
