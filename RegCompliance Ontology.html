<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RegCompliance Ontology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: working console — sticky tab bar, one panel at a time, tables scroll inside their own frames */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef2; --fg:#16191e; --muted:#5a6270; --line:#d9dde3;
  --accent:#c4000f; --accent-soft:#fbe9ea; --ok:#1d7a4f; --ok-soft:#e3f3ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fae6e4;
  --lineage:#2f6fd6; --impact:#d0452f; --context:#7c8a2e; --prov:#7b8494;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d22; --sunk:#22262c; --fg:#e7e9ee; --muted:#9aa2b0; --line:#30353d;
  --accent:#ff5a63; --accent-soft:#3a1c1f; --ok:#5bc48f; --ok-soft:#173226; --warn:#e8b053; --warn-soft:#3a2d14; --bad:#ff7b72; --bad-soft:#3d1d1b;
  --lineage:#6f9dff; --impact:#ff7a62; --context:#b6c45a; --prov:#9aa3b2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d22; --sunk:#22262c; --fg:#e7e9ee; --muted:#9aa2b0; --line:#30353d;
  --accent:#ff5a63; --accent-soft:#3a1c1f; --ok:#5bc48f; --ok-soft:#173226; --warn:#e8b053; --warn-soft:#3a2d14; --bad:#ff7b72; --bad-soft:#3d1d1b;
  --lineage:#6f9dff; --impact:#ff7a62; --context:#b6c45a; --prov:#9aa3b2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-block:8px 16px}
h1{font-size:26px;margin:0;letter-spacing:-.3px;text-wrap:balance}
h1 small{font:500 15px var(--mono);color:var(--accent);margin-left:8px}
.sub{color:var(--muted);margin:2px 0 0;max-width:70ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;margin-bottom:20px}
nav button{font:600 14px var(--sans);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section[role="tabpanel"]{display:flex;flex-direction:column;gap:18px}
h2{font-size:19px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0;max-width:75ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font:600 26px var(--mono);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{font:500 13px var(--sans);padding:6px 10px;border-radius:6px;background:var(--sunk)}
.chain span.hub{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chain i{color:var(--muted);font-style:normal}
.pill{display:inline-block;font:600 11px var(--sans);letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.p-AVAILABLE,.p-PASS,.p-core{background:var(--ok-soft);color:var(--ok)}
.p-PARTIAL,.p-Warning,.p-warning{background:var(--warn-soft);color:var(--warn)}
.p-MISSING,.p-Violation{background:var(--bad-soft);color:var(--bad)}
.p-DERIVED,.p-evidence,.p-impact,.p-ai-governance,.p-MUST,.p-SHOULD,.p-COULD{background:var(--sunk);color:var(--fg)}
.p-MUST{background:var(--accent-soft);color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
input[type=search]{width:100%;max-width:420px;font:14px var(--sans);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:72vh}
svg text{font-family:var(--sans)}
.node{cursor:pointer}
.node:focus-visible rect{stroke-width:3}
.maptools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.crumb{font:600 13px var(--sans);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.crumb.here{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sep{color:var(--muted)}
.inh{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}

.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1100px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:78vh;overflow:auto;min-width:0}
.explain h3{font-size:17px}.explain h4{font-size:13px;margin:6px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.explain .count{font:600 12px var(--mono);background:var(--sunk);color:var(--fg);border-radius:999px;padding:1px 8px}
.ex-head{display:flex;align-items:center;gap:8px;font-size:13px}
.sent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sent li{display:flex;gap:10px;padding:7px 8px;border-radius:6px;font-size:14px;line-height:1.45;cursor:default}
.sent li:hover,.sent li.lit,.sent li:focus-visible{background:var(--sunk)}
.kbar{flex:none;width:3px;border-radius:2px;align-self:stretch}
.verb{font-weight:600;color:var(--fg);background:color-mix(in srgb,var(--kc) 16%,transparent);border-bottom:2px solid var(--kc);padding:0 4px;border-radius:3px}
.via,.note{display:block;font-size:12.5px;color:var(--muted)}
.lnk{font:600 14px var(--sans);color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.legend-v{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}.legend-v span{display:flex;align-items:center;gap:8px}
.legend-v i{width:24px;border-top:2.5px solid}.legend-v i.dash{border-top:2px dashed var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px var(--sans);background:var(--surface);color:var(--muted);border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lbl.lit rect{stroke-width:2.6}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.fstep{flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.fstep b{font-size:14px}.fstep span:last-child{color:var(--muted)}
.fstep.hub{border-color:var(--accent);background:var(--accent-soft)}
.farrow{align-self:center;color:var(--muted);font-size:18px}
@media (max-width:900px){.farrow{display:none}}
.askrow{display:flex;gap:8px;flex-wrap:wrap}.askrow input{flex:1 1 280px;max-width:none;font-size:15px;padding:10px 12px}
.askrow button,.btn2{font:600 14px var(--sans);background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.btn2{background:var(--sunk);color:var(--fg);padding:7px 12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:s}
.steps li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);transition:background .2s,border-color .2s}
.steps li b{color:var(--fg);font-size:14px}
.steps li.on{border-color:var(--accent);background:var(--accent-soft)}
.steps li.done{border-color:var(--ok);background:var(--ok-soft)}
.ares{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.answer{font-size:17px;line-height:1.5;max-width:80ch}
.meta,.cite,.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.tag{font:500 12px var(--mono);background:var(--sunk);border-radius:4px;padding:2px 6px}
.nores{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.nores ul{margin:6px 0 0;padding-left:18px}
details.panel summary{font-weight:600;color:var(--fg)}
#svg.fit{width:100%;height:auto;min-width:900px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:0;border-top:2px solid}
.detail{min-height:90px}
.cq{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cq header{padding:0;display:flex;gap:10px;align-items:center;justify-content:flex-start}
.cq header b{font:600 13px var(--mono);color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{font:12.5px/1.5 var(--mono);background:var(--sunk);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre;margin:6px 0 0}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.verdict .panel h3{display:flex;align-items:center;gap:8px}
.res{font-size:13.5px;display:flex;gap:8px;align-items:baseline}
</style>

<div class="wrap">
<header>
  <div><h1>Regulatory Compliance Ontology <small id="ver"></small></h1>
  <p class="sub">From a regulatory alert to the obligations, risks, controls, policies and people it affects. AI-made links are recorded with evidence and only count once a human confirms them.</p></div>

tural lineage.", "cqs": ["CQ01", "CQ12", "CQ16"], "align": "", "note": "Structured instrument, not a text mention", "guide": ""}, {"id": "RegulatorySummary", "m": "REG", "l": "Regulation Summary (RSM)", "parent": "Entity", "src": "RegMap SUM_ID", "status": "AVAILABLE", "d": "Business summary of a coherent part of a regulation; the correct granularity for alert linkage.", "cqs": ["CQ01", "CQ02"], "align": "", "note": "", "guide": ""}, {"id": "RegulatoryObligation", "m": "REG", "l": "Regulatory Obligation (ROB)", "parent": "Requirement", "src": "RegMap ROB_ID", "status": "AVAILABLE", "d": "Atomic, testable duty derived from a regulation summary. The hub that controls, policy requirements and procedure steps satisfy.", "cqs": ["CQ01", "CQ02", "CQ03", "CQ04", "CQ05", "CQ09"], "align": "", "note": "Now a Requirement subclass", "guide": "Classify modality from verbs: must/shall \u2192 MUST; must not/shall not/may not \u2192 MUST_NOT; may/is permitted \u2192 MAY; should/is expected \u2192 SHOULD. One obligation per testable duty."}, {"id": "Provision", "m": "REG", "l": "Provision / Article", "parent": "Entity", "src": "Regulatory text", "status": "PARTIAL", "d": "Article, rule or paragraph of the source legal text an obligation cites.", "cqs": ["CQ16"], "align": "", "note": "", "guide": ""}, {"id": "RegulatoryDocument", "m": "REG", "l": "Regulatory Document", "parent": "Entity", "src": "Source PDF / URL", "status": "PARTIAL", "d": "Published text (rulebook, consultation paper, guidance, Dear CEO letter).", "cqs": ["CQ16"], "align": "", "note": "", "guide": ""}, {"id": "DefinedTerm", "m": "REG", "l": "Defined Term", "parent": "Entity", "src": "Glossary / Provision", "status": "PARTIAL", "d": "A term formally defined in regulation; used for entity resolution across texts.", "cqs": ["CQ16"], "align": "", "note": "Renamed from Definition", "guide": "Emit only for explicit 'means / is defined as' text. Store headword in term, gloss in definitionText."}, {"id": "Condition", "m": "SEM", "l": "Condition", "parent": "Entity", "src": "LLM extraction from ROB text", "status": "DERIVED", "d": "Criterion evaluated before an obligation applies (threshold, risk class, status). Gates applicability; not an event.", "cqs": ["CQ06"], "align": "", "note": "", "guide": "Condition is a test that is evaluated (if/where/provided that). An event that happens is a Trigger."}, {"id": "Trigger", "m": "SEM", "l": "Trigger", "parent": "Entity", "src": "LLM extraction / Rapid2", "status": "DERIVED", "d": "Business or regulatory event that initiates an obligation or an assessment. A regulatory alert is a Trigger.", "cqs": ["CQ01"], "align": "", "note": "NEW", "guide": "A Trigger happens (receipt, publication, alert). If it is a yes/no criterion, use Condition."}, {"id": "Exception", "m": "SEM", "l": "Exception / Exemption", "parent": "Entity", "src": "LLM extraction from ROB text", "status": "DERIVED", "d": "Documented carve-out that disapplies or overrides a requirement.", "cqs": ["CQ06"], "align": "", "note": "Gains overrides / exempts", "guide": "Link with overrides to the Requirement it carves out from."}, {"id": "TemporalConstraint", "m": "SEM", "l": "Temporal Constraint", "parent": "Entity", "src": "LLM extraction / RegMap dates", "status": "DERIVED", "d": "Deadline, duration, recurrence, effective or transition period attached to a requirement or control.", "cqs": ["CQ08"], "align": "", "note": "Typed via TemporalType vocabulary", "guide": ""}, {"id": "ApplicabilityScope", "m": "SEM", "l": "Applicability Scope", "parent": "Entity", "src": "Rule / LLM extraction", "status": "PARTIAL", "d": "Machine-evaluable boundary of where a requirement applies: jurisdictions, legal entities, businesses, products, processes, customer segments.", "cqs": ["CQ07", "CQ11"], "align": "", "note": "Links to mastered business data, not free text", "guide": ""}, {"id": "RegulatoryAlert", "m": "CHG", "l": "Regulatory Alert", "parent": "Trigger", "src": "Rapid2 RECORD_ID", "status":   <div class="crumbs" id="crumbs" aria-live="polite"></div>

</div>
<div class="chips" id="mchips"></div><div class="chips" id="kchips"></div>
<div class="mapgrid">
  <div class="mapwrap" id="mapwrap"><svg id="svg" role="img" aria-label="Ontology class map"></svg></div>
  <aside class="explain" id="explain" aria-live="polite"></aside>
</div>`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
["network","focus"].forEach(v=>document.getElementById("v-"+v).onclick=()=>{view=v;try{localStorage.setItem("rcview",v)}catch(e){}drawMap()});
document.getElementById("inh").onchange=()=>drawMap();

function chips(){
  const mc=document.getElementById("mchips"); mc.innerHTML="";
  ORDER.forEach(m=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",onM.has(m));
    b.innerHTML=`<span class="dot" style="background:${D.modules[m].c}"></span>${esc(D.modules[m].n)}`;b.onclick=()=>{onM.has(m)?onM.delete(m):onM.add(m);chips();drawMap()};mc.appendChild(b)});
  const kc=document.getElementById("kchips"); kc.innerHTML="";
  Object.entries(KIND).forEach(([k,[n,c]])=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",onK.has(k));
    b.innerHTML=`<span class="dot" style="background:${c}"></span>${n}`;b.onclick=()=>{onK.has(k)?onK.delete(k):onK.add(k);chips();drawMap()};kc.appendChild(b)});
}
const NW=176,NH=34,CX=206,RY=46,TOP=48,pos={};
ORDER.forEach((m,i)=>D.classes.filter(c=>c.m===m).forEach((c,j)=>pos[c.id]={x:16+i*CX,y:TOP+j*RY}));
const OW=16+ORDER.length*CX, OH=TOP+Math.max(...ORDER.map(m=>D.classes.filter(c=>c.m===m).length))*RY+16;
function ancestors(id){const out=[];let p=byId[id]&&byId[id].parent;while(p&&p!=="Entity"){out.push(p);p=byId[p].parent}return out}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+"…":s}

function drawMap(){
  if(!document.getElementById("mchips").children.length) chips();
  document.getElementById("v-network").setAttribute("aria-pressed",view==="network");
  document.getElementById("v-focus").setAttribute("aria-pressed",view==="focus");
  crumbs();
  (sel && view==="focus") ? drawFocus() : drawNetwork();
  explain();
  document.querySelectorAll("#svg .lbl").forEach(l=>{l.onmouseenter=()=>hl(l.dataset.key);l.onmouseleave=()=>hl(null)});
}
function crumbs(){
  const c=document.getElementById("crumbs");
  let h=`<button class="crumb${sel?"":" here"}" data-go="">All classes</button>`;
  trail.forEach((id,i)=>{h+=`<span class="sep" aria-hidden="true">›</span><button class="crumb${i===trail.length-1?" here":""}" data-go="${id}">${esc(byId[id].l)}</button>`});
  c.innerHTML=h;
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(!id){sel=null;trail=[]}else{trail=trail.slice(0,trail.indexOf(id)+1);sel=id}drawMap()});
  document.getElementById("inhwrap").hidden=!sel;
  document.getElementById("mchips").hidden=!!sel&&view==="focus";
}
function focus(id){
  if(!byId[id]) return;
  if(sel===id && view==="network"){ sel=null; trail=[]; drawMap(); return }
  const i=trail.indexOf(id); trail = i>=0 ? trail.slice(0,i+1) : [...trail,id]; sel=id;
  drawMap();
  if(view==="focus") document.getElementById("mapwrap").scrollTo({top:0,left:0,behavior:reduce?"auto":"smooth"});
}
function bindNodes(s,hoverable){
  s.querySelectorAll(".node").forEach(n=>{const id=n.dataset.id;const go=()=>focus(id);
    n.onclick=go;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
    if(hoverable){n.onmouseenter=n.onfocus=()=>light(s,id);n.onmouseleave=n.onblur=()=>light(s,null)}});
}
function light(s,id){
  if(sel) return;
  s.querySelectorAll(".ov-edge").forEach(p=>{const hi=id&&(p.dataset.f===id||p.dataset.t===id);
    p.setAttribute("opacity",id?(hi?.95:.07):.34);p.setAttribute("stroke-width",hi?2.2:1.1)});
}

/* relationship sets for a class (own + optionally inherited) */
function edgesFor(id, withInherited){
  const inh = withInherited ? ancestors(id) : [];
  const out=[], inn=[];
  [id,...inh].forEach(src=>D.rels.forEach(e=>{ if(!onK.has(e.k)) return;
    const via = src===id ? "" : src;
    if(e.f===src) out.push({...e,via,other:e.t});
    if(e.t===src && e.f!==src) inn.push({...e,via,other:e.f}); }));
  const k=e=>e.r+"|"+e.other, uniq=a=>a.filter((e,i)=>a.findIndex(x=>k(x)===k(e))===i);
  const rank={S:0,I:1,C:2,P:3}, sort=a=>a.sort((x,y)=>rank[x.k]-rank[y.k]||x.r.localeCompare(y.r));
  return {out:sort(uniq(out)), inn:sort(uniq(inn).filter(e=>e.other!=="Entity"))};
}

/* ---------- network view: whole map; selection highlights edges with collision-free labels ---------- */
function curve(e){
  const a=pos[e.f],b=pos[e.t];
  if(e.f===e.t) return {d:`M${a.x+NW},${a.y+9} c40,-18 40,34 0,16`, mx:a.x+NW+30, my:a.y+17};
  if(a.x===b.x){const y1=a.y+NH/2,y2=b.y+NH/2,x=a.x+NW;return {d:`M${x},${y1} C${x+54},${y1} ${x+54},${y2} ${x},${y2}`, mx:x+40, my:(y1+y2)/2}}
  const fw=b.x>a.x,x1=fw?a.x+NW:a.x,x2=fw?b.x:b.x+NW,y1=a.y+NH/2,y2=b.y+NH/2,dx=Math.max(40,Math.abs(x2-x1)/2)*(fw?1:-1);
  return {d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`, mx:(x1+x2)/2, my:(y1+y2)/2};
}
function drawNetwork(){
  const s=document.getElementById("svg"); s.setAttribute("viewBox",`0 0 ${OW} ${OH}`); s.setAttribute("width",OW); s.setAttribute("height",OH); s.classList.remove("fit");
  const vis=e=>pos[e.f]&&pos[e.t]&&e.f!=="Entity"&&e.t!=="Entity"&&onK.has(e.k)&&onM.has(byId[e.f].m)&&onM.has(byId[e.t].m);
  const selEdges = sel ? D.rels.filter(e=>vis(e)&&(e.f===sel||e.t===sel)) : [];
  const nb=new Set(selEdges.flatMap(e=>[e.f,e.t])); if(sel) nb.add(sel);
  let g=`<defs>${Object.entries(KIND).map(([k,[,cl]])=>`<marker id="nh-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${cl}"/></marker>`).join("")}</defs>`;
  ORDER.forEach((m,i)=>{if(onM.has(m))g+=`<text x="${16+i*CX}" y="26" font-size="11.5" font-weight="700" letter-spacing=".06em" fill="${D.modules[m].c}">${esc(D.modules[m].n.toUpperCase())}</text>`});
  D.rels.forEach(e=>{ if(!vis(e)) return; const hi=sel&&(e.f===sel||e.t===sel); if(hi) return;
    const c=curve(e); g+=`<path class="ov-edge" data-f="${e.f}" data-t="${e.t}" d="${c.d}" fill="none" stroke="${KIND[e.k][1]}" stroke-width="1.1" opacity="${sel?.05:.34}"><title>${esc(e.f+" "+e.r+" "+e.t)}</title></path>`});
  selEdges.forEach(e=>{const c=curve(e);
    g+=`<path class="sel-edge" data-key="${ekey(e)}" d="${c.d}" fill="none" stroke="${KIND[e.k][1]}" stroke-width="2.4" marker-end="url(#nh-${e.k})"><title>${esc(e.f+" "+e.r+" "+e.t)}</title></path>`});
  D.classes.forEach(c=>{if(!onM.has(c.m))return;const p=pos[c.id],col=D.modules[c.m].c,isSel=sel===c.id,dim=sel&&!nb.has(c.id);
    g+=`<g class="node" tabindex="0" role="button" aria-label="Select ${esc(c.l)}" data-id="${c.id}" opacity="${dim?.2:1}">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6" fill="${isSel?col:"var(--surface)"}" fill-opacity="${isSel?.18:1}" stroke="${col}" stroke-width="${isSel?2.8:(sel&&nb.has(c.id)?2:1.4)}" ${c.status==="MISSING"?'stroke-dasharray="3 3"':""}/>
      <text x="${p.x+NW/2}" y="${p.y+NH/2+4}" text-anchor="middle" font-size="12" font-weight="${isSel?700:400}" fill="var(--fg)">${esc(trunc(c.l,26))}</text></g>`});
  /* labels last: one tag per neighbour box, pinned on its top edge, so labels can never collide */
  if(sel){
    const tags={};
    selEdges.forEach(e=>{const other=e.f===sel?e.t:e.f, dir=e.f===e.t?"↻":(e.f===sel?"→":"←");
      (tags[other]=tags[other]||[]).push({e,txt:`${dir} ${e.r}`})});
    Object.entries(tags).forEach(([id,list])=>{const p=pos[id]; if(!p) return;
      let x=p.x+NW/2; const total=list.reduce((a,t)=>a+t.txt.length*6.5+18,0)+(list.length-1)*4; let cx=x-total/2;
      list.forEach(t=>{const w=t.txt.length*6.5+18, h=18, y=p.y-h/2, kc=KIND[t.e.k][1];
        g+=`<g class="lbl" data-key="${ekey(t.e)}"><rect x="${cx}" y="${y}" width="${w}" height="${h}" rx="9" fill="var(--surface)" stroke="${kc}" stroke-width="1.5"/>
          <text x="${cx+w/2}" y="${y+12.5}" text-anchor="middle" font-size="11" font-weight="600" font-family="var(--mono)" fill="var(--fg)">${esc(t.txt)}</text><title>${esc(t.e.f+" "+t.e.r+" "+t.e.t)}</title></g>`;
        cx+=w+4;});
    });
  }
  s.innerHTML=g; bindNodes(s,!sel);
  if(sel&&pos[sel]){const w=document.getElementById('mapwrap');w.scrollTo({left:Math.max(0,pos[sel].x+NW/2-w.clientWidth/2),top:Math.max(0,pos[sel].y-w.clientHeight/2),behavior:reduce?'auto':'smooth'})}
}

/* ---------- focus view: incoming left, outgoing right, one lane per label ---------- */
function drawFocus(){
  const c=byId[sel], {out,inn}=edgesFor(sel, document.getElementById("inh").checked);
  const RH=54, TOPF=80, n=Math.max(out.length,inn.length,1), W=1320;
  const LBX=24, LBW=220, LPC=354, CW=260, CL=W/2-CW/2, CR=CL+CW, RPC=W-LPC, RBX=W-24-LBW, LANE=90;
  const CH=Math.max(96,Math.min(n*RH-14,220)), CY=TOPF+20+(n-1)*RH/2-CH/2;
  const rowY=(i,len)=>TOPF+(n-len)*RH/2+i*RH+20;
  const H=Math.max(TOPF+20+(n-1)*RH+40, CY+CH+30);
  const s=document.getElementById("svg"); s.setAttribute("viewBox",`0 0 ${W} ${H}`); s.setAttribute("width",W); s.setAttribute("height",H); s.classList.add("fit");
  const col=D.modules[c.m].c;
  let g=`<defs>${Object.entries(KIND).map(([k,[,cl]])=>`<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${cl}"/></marker>`).join("")}</defs>`;
  g+=`<text x="${LBX}" y="30" font-size="12" font-weight="700" letter-spacing=".08em" fill="var(--muted)">POINTS TO ${esc(c.l.toUpperCase())}  ·  ${inn.length}</text>`;
  g+=`<text x="${W-24}" y="30" text-anchor="end" font-size="12" font-weight="700" letter-spacing=".08em" fill="var(--muted)">${esc(c.l.toUpperCase())} POINTS TO  ·  ${out.length}</text>`;
  const pillF=(cx,y,e)=>{const name=e.r, sub=e.via?`via ${byId[e.via].l}`:"", fs=name.length>22?11:12.5, w=Math.min(176,Math.max(name.length*fs*0.62,sub.length*6)+26);
    return `<g class="lbl" data-key="${ekey(e)}"><rect x="${cx-w/2}" y="${y-(sub?17:12)}" width="${w}" height="${sub?34:24}" rx="12" fill="var(--surface)" stroke="${KIND[e.k][1]}" stroke-width="1.4" ${e.via?'stroke-dasharray="4 3"':""}/>
      <text x="${cx}" y="${y+(sub?-1:4)}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="var(--fg)" font-family="var(--mono)">${esc(name)}</text>
      ${sub?`<text x="${cx}" y="${y+11}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(trunc(sub,28))}</text>`:""}<title>${esc(e.f+" "+e.r+" "+e.t+" ["+e.card+"]")}</title></g>`};
  const box=(x,y,id,align)=>{const vocab=id.startsWith("Vocab:"),cl=vocab?null:byId[id],label=vocab?"vocab: "+id.slice(6):(id===sel?c.l+" (itself)":cl.l),mc=vocab?"var(--muted)":D.modules[cl.m].c;
    const attrs=vocab||id===sel?"":`class="node" tabindex="0" role="button" aria-label="Focus on ${esc(cl.l)}" data-id="${id}"`;
    return `<g ${attrs}><rect x="${x}" y="${y-18}" width="${LBW}" height="36" rx="7" fill="var(--surface)" stroke="${mc}" stroke-width="1.5" ${vocab||(cl&&cl.status==="MISSING")?'stroke-dasharray="4 3"':""}/>
      <rect x="${align==="l"?x:x+LBW-5}" y="${y-18}" width="5" height="36" fill="${mc}" rx="2"/>
      <text x="${x+LBW/2}" y="${y+4.5}" text-anchor="middle" font-size="12.5" fill="var(--fg)">${esc(trunc(label,29))}</text></g>`};
  const attach=(i,len)=>CY+CH*(len===1?.5:(0.18+0.64*i/(len-1)));
  inn.forEach((e,i)=>{const y=rowY(i,inn.length), ay=attach(i,inn.length);
    g+=`<path class="sel-edge" data-key="${ekey(e)}" d="M${LBX+LBW},${y} H${LPC+LANE} C${(LPC+LANE+CL)/2},${y} ${(LPC+LANE+CL)/2},${ay} ${CL},${ay}" fill="none" stroke="${KIND[e.k][1]}" stroke-width="1.6" ${e.via?'stroke-dasharray="5 4"':""} marker-end="url(#ah-${e.k})"/>`;
    g+=box(LBX,y,e.other,"l")+pillF(LPC,y,e)});
  out.forEach((e,i)=>{const y=rowY(i,out.length), ay=attach(i,out.length);
    g+=`<path class="sel-edge" data-key="${ekey(e)}" d="M${CR},${ay} C${(CR+RPC-LANE)/2},${ay} ${(CR+RPC-LANE)/2},${y} ${RPC-LANE},${y} H${RBX}" fill="none" stroke="${KIND[e.k][1]}" stroke-width="1.6" ${e.via?'stroke-dasharray="5 4"':""} marker-end="url(#ah-${e.k})"/>`;
    g+=pillF(RPC,y,e)+box(RBX,y,e.other,"r")});
  g+=`<g><rect x="${CL}" y="${CY}" width="${CW}" height="${CH}" rx="10" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-width="2.5"/>
     <text x="${CL+CW/2}" y="${CY+CH/2-8}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${esc(trunc(c.l,32))}</text>
     <text x="${CL+CW/2}" y="${CY+CH/2+14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(D.modules[c.m].n)} · ${esc(c.status.toLowerCase())}</text>
     ${c.parent&&c.parent!=="Entity"?`<text x="${CL+CW/2}" y="${CY+CH/2+32}" text-anchor="middle" font-size="11.5" fill="var(--muted)">is a ${esc(byId[c.parent].l)}</text>`:""}</g>`;
  if(!inn.length) g+=`<text x="${LBX}" y="${rowY(0,1)+4}" font-size="13" fill="var(--muted)">Nothing points here.</text>`;
  if(!out.length) g+=`<text x="${W-24}" y="${rowY(0,1)+4}" text-anchor="end" font-size="13" fill="var(--muted)">No outgoing relationships.</text>`;
  s.style.opacity=0; s.innerHTML=g; bindNodes(s,false);
  requestAnimationFrame(()=>{s.style.transition=reduce?"none":"opacity .18s";s.style.opacity=1});
}

/* ---------- explain panel: the relationships in plain sentences ---------- */
function sentence(e, outgoing){
  const subj = outgoing ? byId[sel].l : nameOf(e.other), obj = outgoing ? nameOf(e.other) : byId[sel].l;
  const verb = PHRASE[e.r] || e.r.replace(/([A-Z])/g," $1").toLowerCase();
  const card = e.t.startsWith("Vocab:") ? "a value from" : (CARD[e.card] || e.card);
  const otherBtn = e.other.startsWith("Vocab:") ? `<b>${esc(nameOf(e.other))}</b>` : `<button class="lnk" data-go="${e.other}">${esc(nameOf(e.other))}</button>`;
  const subjH = outgoing ? `<b>${esc(subj)}</b>` : otherBtn, objH = outgoing ? otherBtn : `<b>${esc(obj)}</b>`;
  const cardTxt = e.t.startsWith("Vocab:") ? "" : `${esc(card)} `;
  return `<li data-key="${ekey(e)}" tabindex="0"><span class="kbar" style="background:${KIND[e.k][1]}"></span><span>Each ${subjH} <span class="verb" style="--kc:${KIND[e.k][1]}">${esc(verb)}</span> ${outgoing?cardTxt:""}${objH}.${e.via?` <span class="via">inherited from ${esc(byId[e.via].l)}</span>`:""}${e.n?` <span class="note">${esc(e.n)}</span>`:""}</span></li>`;
}

   <h4>What it connects to <span class="count">${out.length}</span></h4><ul class="sent">${out.map(e=>sentence(e,true)).join("")||"<li class=muted>None</li>"}</ul>

   ${view==="network"?`<p class="muted">Inherited relationships appear in Focus view.</p>`:""}`;
  box.querySelectorAll(".lnk").forEach(b=>b.onclick=()=>focus(b.dataset.go));
  box.querySelectorAll("li[data-key]").forEach(li=>{const k=li.dataset.key;

/* ---------- classes / relationships ---------- */
function tableTab(id, cols, rows, ph){
  const el=document.getElementById(id);
  el.innerHTML=`<input type="search" id="${id}-q" placeholder="${ph}" aria-label="${ph}"><div class="tablewrap"><table id="${id}-t"></table></div>`;
  const render=q=>{q=q.toLowerCase();document.getElementById(id+"-t").innerHTML=`<tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>`+rows.filter(r=>r.text.toLowerCase().includes(q)).map(r=>r.html).join("")};
  render(""); document.getElementById(id+"-q").oninput=e=>render(e.target.value);
}

const KEYS = {
 CQ01:"obligation obligations change changes affected affect alert rob which",CQ02:"summary summaries rsm linked confidence confirmed score",
 CQ03:"control controls impacted impact library l1c 1c",CQ04:"risk risks library taxonomy area",CQ05:"gap gaps uncovered coverage missing no control policy",
 CQ06:"condition conditions exception exceptions exemption apply when",CQ07:"entity entities business businesses scope legal lob in-scope where",
 CQ08:"when deadline date comply compliance timeline by",CQ09:"policy policies requirement gpps implement implements",CQ10:"findings finding remediation remediate action fix",
 CQ11:"blast radius footprint how big size scale count",CQ12:"regulator issued jurisdiction who issued",CQ13:"alerts arrived risk area my",
 CQ14:"issue issues open failed test tests already",CQ15:"owner owners own owns owned who sign signoff sign-off accountable responsible impacted control controls",CQ16:"provision article articles defined term definition",
 CQ17:"procedure step steps day to day how met system role operate",CQ18:"why evidence quote explain model run justify proof control scope linked",
 CQ19:"review queue waiting pending sme unreviewed",CQ20:"accuracy perform performance agree agreement model ai human",
};
const STOP=new Set("the a an of to is are in on for and or does do this that what which how with by be it its my our".split(" "));
function route(q){
  const toks=q.toLowerCase().replace(/[^a-z0-9\s-]/g," ").split(/\s+/).filter(t=>t&&!STOP.has(t));
  const sc=Object.entries(KEYS).map(([id,k])=>{const ks=k.split(" ");let s=0;toks.forEach(t=>{if(ks.includes(t))s+=2;else if(ks.some(x=>x.startsWith(t)||t.startsWith(x)))s+=1});return [id,s]}).sort((a,b)=>b[1]-a[1]);
  return sc;
}

document.getElementById("askf").onsubmit=e=>{e.preventDefault();const q=document.getElementById("q").value.trim();if(q)ask(q)};
let askTimer=[];
function ask(q){
  askTimer.forEach(clearTimeout); askTimer=[];
  const steps=[...document.querySelectorAll("#steps li")]; steps.forEach(s=>s.className="");
  const out=document.getElementById("ans"); out.innerHTML="";
  const ranked=route(q), [best,score]=ranked[0];
  const delay=reduce?0:260;
  const go=(i,f)=>askTimer.push(setTimeout(f,delay*i));
  go(0,()=>steps[0].className="on");
  if(score<2){
    go(1,()=>{steps[0].className="done";out.innerHTML=`<div class="nores"><b>No grounded answer.</b> The graph has no path that answers this, so nothing is made up. Closest questions it can answer:<ul>${ranked.slice(0,3).filter(r=>r[1]>0).map(r=>`<li><button class="lnk" data-q="${esc(CQX[r[0]].q)}">${esc(CQX[r[0]].q)}</button></li>`).join("")||"<li>Try one of the suggestions above.</li>"}</ul></div>`;
      out.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{document.getElementById("q").value=b.dataset.q;ask(b.dataset.q)})});
    return;
  }
  const cq=CQX[best], rows=cq.rows;
  go(1,()=>{steps[0].className="done";steps[1].className="on"});
  go(2,()=>{steps[1].className="done";steps[2].className="on"});
  go(3,()=>{steps[2].className="done";steps[3].className="on"});
  go(4,()=>{steps[3].className="done";
    const cited=[...new Set(rows.flat().filter(v=>/^(ROB|RSM|LA|CTRL|1C|L1C|LR|PR|GAP|R2|CHG|RUN|IA)[-0-9A-Z]*$/i.test(v)||/^(ROB|RSM)\d$/.test(v)))].slice(0,10);
    const path=CQX[best] && D.cqClasses[best] ? D.cqClasses[best].map(id=>byId[id]?byId[id].l:id).join(" → ") : "";
    out.innerHTML=`<div class="ares">
      <p class="answer">${esc(ANSWER[best](rows))}</p>
      <div class="meta"><span class="pill p-MUST">${best}</span><span class="muted">Matched: ${esc(cq.q)}</span></div>
      ${cited.length?`<div class="cite"><span class="muted">Grounded in</span>${cited.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div>`:""}
      <p class="muted"><b>Path used:</b> ${esc(path)}</p>
      <div class="arow"><button class="btn2" id="showmap">Show in map</button></div>
      <details><summary>Cypher run on Neo4j</summary><pre>${esc(D.cypher[best])}</pre></details>
      <details><summary>Rows returned (${rows.length})</summary><div class="tablewrap"><table><tr>${cq.vars.map(v=>`<th>${esc(v)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div></details></div>`;
    document.getElementById("showmap").onclick=()=>{sel=null;trail=[];view="focus";select("map");focus(PRIMARY[best])};
  });
}
